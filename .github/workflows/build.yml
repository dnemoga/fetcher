name: Build
run-name: ${{ github.workflow }}

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ github.sha }}
          path: |
            lib/**/*.js
            lib/**/*.d.ts
            package.json
            README.md
            LICENSE
            index.js
          compression-level: 0
